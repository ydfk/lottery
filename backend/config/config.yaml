# 应用基础配置。
app:
  # 后端服务监听端口。
  port: "25610"
  # 运行环境，常用值：development / production。
  env: "development"

# JWT 鉴权配置。
jwt:
  # JWT 签名密钥，生产环境请仅放在 config.local.yaml 中覆盖。
  secret: "123456789"
  # Token 有效期，单位：秒。
  expiration: 604800

# 数据存储配置。
database:
  # 数据库驱动，支持 sqlite / postgres。
  driver: "sqlite"
  # SQLite 数据库文件路径。
  path: "data/lottery.sqlite"
  # PostgreSQL 连接串，填写后优先使用。
  dsn: ""
  # PostgreSQL 主机地址。
  host: "127.0.0.1"
  # PostgreSQL 端口。
  port: 5432
  # PostgreSQL 用户名。
  user: "postgres"
  # PostgreSQL 密码，建议放在 config.local.yaml 中覆盖。
  password: ""
  # PostgreSQL 数据库名。
  name: "lottery"
  # PostgreSQL SSL 模式。
  sslMode: "disable"
  # PostgreSQL 时区。
  timeZone: "Asia/Shanghai"
  # 数据库最大空闲连接数，0 表示使用驱动默认值。
  maxIdleConns: 0
  # 数据库最大打开连接数，0 表示使用驱动默认值。
  maxOpenConns: 0

# 本地文件存储配置。
storage:
  # 上传文件根目录，彩票原图会保存在该目录下。
  uploadDir: "data/uploads"

# 极速数据接口配置，用于同步开奖信息。
jisu:
  # 极速数据基础地址。
  baseURL: "https://api.jisuapi.com"
  # 极速数据 appKey，建议放到 config.local.yaml 中覆盖。
  appKey: ""
  # 调用极速数据接口超时时间，单位：秒。
  timeoutSeconds: 15

# 数据补偿任务配置。
compensation:
  # 是否启用补偿任务。
  enabled: true
  # 补偿任务列表，type 用于后续扩展不同补偿逻辑。
  jobs:
    - name: "previous-draw-prize"
      type: "drawPrize"
      enabled: true
      # 每天凌晨 3 点和早上 8 点检查前一天开奖数据。
      cron: "0 0 3,8 * * *"
      targetDateOffsetDays: 1

# AI 推荐模型连接配置。
ai:
  # OpenAI 兼容接口基础地址，例如 http://host/v1。
  baseURL: ""
  # AI 接口密钥，建议放到 config.local.yaml 中覆盖。
  apiKey: ""
  # AI 接口超时时间，单位：秒。
  timeoutSeconds: 20
  # 推荐和 OCR 请求日志合计保留条数。
  requestLogLimit: 1000

# OCR 识别服务配置。
vision:
  # 视觉服务提供方，当前固定使用 paddleocr。
  provider: "paddleocr"
  # 视觉服务模型或接口标识。
  model: "layout-parsing"
  # PaddleOCR HTTP 服务地址。
  baseURL: ""
  # PaddleOCR 服务访问密钥。
  apiKey: ""
  # OCR 接口超时时间，单位：秒。
  timeoutSeconds: 90
  # 是否启用文档方向分类。
  useDocOrientationClassify: false
  # 是否启用文档去扭曲。
  useDocUnwarping: false
  # 是否启用图表识别。
  useChartRecognition: false

# Passkey 依赖 HTTPS 域名和 iOS Associated Domains 配置。
passkey:
  rpID: "lottery.ydfk.site"
  rpName: "彩迹"
  origins:
    - "https://lottery.ydfk.site"
  appID: "B6AA23TY3H.com.ydfk.lottery"

# 彩票类型配置。
# 每个彩种的规则、开奖同步和推荐生成都从这里读取。
lotteries:
  - code: "ssq"
    # 彩种名称。
    name: "福彩双色球"
    # 是否启用该彩种。
    enabled: true
    # 第三方开奖接口对应的彩票 ID。
    remoteLotteryId: "11"
    # 红球数量。
    redCount: 6
    # 蓝球数量。
    blueCount: 1
    # 红球最小值。
    redMin: 1
    # 红球最大值。
    redMax: 33
    # 蓝球最小值。
    blueMin: 1
    # 蓝球最大值。
    blueMax: 16

    # 官方开奖日配置。
    drawSchedule:
      # 开奖星期，0-6 分别表示周日到周六。
      weekdays: [2, 4, 0]
      # 官方开奖时间，24 小时制。
      time: "21:30"
      # 本地确认的锚点期号，后续会按本地开奖节奏顺推和回推。
      anchorIssue: "2026031"
      # 锚点期号对应的本地开奖日期。
      anchorDate: "2026-03-22"

    # 推荐配置。
    recommendation:
      # 是否启用定时推荐生成。
      enabled: true
      # 推荐生成 cron 表达式。
      cron: "0 0 23 * * *"
      # 推荐服务提供方，当前支持 openai-compatible。
      provider: "openai-compatible"
      # 每次生成的推荐注数，recommendations/generate 接口也会使用该值。
      count: 2
      # 推荐模型参考的历史开奖期数。
      historyWindow: 100
      # 推荐使用的 AI 模型名称。
      model: "gpt-5.4-nano"
      # 提示词版本号，便于后续迭代管理。
      promptVersion: "v3"
      # 推荐模型提示词。
      prompt: |
        你是双色球号码组合助手。目标是让推荐组合更分散。历史开奖用于避免完整组合重复、描述分布，蓝球优先级按近期推荐记录决定。
        先选蓝球，再搭配红球。统计“近期已推荐”中每个蓝球的出现次数，未出现记 0。首选优先使用出现次数最少的蓝球；次数相同，优先选更久未被推荐的号码。不要按最近开奖的蓝号热度排序。
        按最终推荐注数，把首选组合放在 numbers 数组最前面，其余位置放备选。前 16 组内蓝球不能重复；候选超过 16 组时，从第 17 组开始均匀分配重复次数。
        各组红球分散到不同区间，首选之间尽量少重叠，避免反复使用同一套红球模板。输出前复查前 16 组的蓝球是否互异，以及首选是否能够换用近期推荐次数更少的蓝球。confidence 仅表示组合符合本次规则的程度。

    # 开奖同步配置。
    sync:
      # 是否启用定时开奖同步。
      enabled: true
      # 开奖同步 cron 表达式。
      cron: "0 0 22 * * *"
      # 每次手动补历史时默认同步多少期。
      historySize: 20

  - code: "dlt"
    # 彩种名称。
    name: "体彩大乐透"
    # 是否启用该彩种。
    enabled: true
    # 第三方开奖接口对应的彩票 ID。
    remoteLotteryId: "14"
    # 前区号码数量。
    redCount: 5
    # 后区号码数量。
    blueCount: 2
    # 前区最小值。
    redMin: 1
    # 前区最大值。
    redMax: 35
    # 后区最小值。
    blueMin: 1
    # 后区最大值。
    blueMax: 12

    # 官方开奖日配置。
    drawSchedule:
      # 开奖星期，0-6 分别表示周日到周六。
      weekdays: [1, 2, 6]
      # 官方开奖时间，24 小时制。
      time: "21:30"
      # 本地确认的锚点期号，后续会按本地开奖节奏顺推和回推。
      anchorIssue: "2026030"
      # 锚点期号对应的本地开奖日期。
      anchorDate: "2026-03-23"

    # 推荐配置。
    recommendation:
      # 是否启用定时推荐生成。
      enabled: true
      # 推荐生成 cron 表达式。
      cron: "0 0 23 * * *"
      # 推荐服务提供方，当前支持 openai-compatible。
      provider: "openai-compatible"
      # 每次生成的推荐注数，recommendations/generate 接口也会使用该值。
      count: 2
      # 推荐模型参考的历史开奖期数。
      historyWindow: 30
      # 推荐使用的 AI 模型名称。
      model: "gpt-5.4-nano"
      # 提示词版本号，便于后续迭代管理。
      promptVersion: "v3"
      # 推荐模型提示词。
      prompt: |
        你是大乐透号码组合助手。目标是分散各注号码。历史开奖用于校验完整重复和描述分布，后区优先级按近期推荐记录决定。
        按最终推荐注数，把首选组合放在 numbers 数组最前面，其余位置放备选。先选后区，再搭配前区。统计“近期已推荐”中各后区号码及完整对子的出现次数，未出现记 0。首选优先使用出现次数较少的号码，次数相同时优先选更久未被推荐的号码；有多个合适的对子时，优先避开近期已用的对子。
        前 6 组之间的后区号码互不重叠，确保前两注有 4 个不同的后区号码。第 7 组起优先使用在本批次中出现次数较少的后区号码；候选中尽量少重复同一个后区对子。
        前区兼顾 01–12、13–24、25–35 三个号段。首选之间尽量少重叠，允许少量连号和不同的奇偶比例，避免每注都套用同一模板。
        输出前检查首选位置、前 6 组的后区重叠和近期后区对子复用情况。reason 具体说明本注如何分散号码，confidence 仅表示组合符合本次规则的程度。

    # 开奖同步配置。
    sync:
      # 是否启用定时开奖同步。
      enabled: true
      # 开奖同步 cron 表达式。
      cron: "0 0 22 * * *"
      # 每次手动补历史时默认同步多少期。
      historySize: 20
